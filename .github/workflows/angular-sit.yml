name: Deploy Angular SIT
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  push:
    branches:
      - sit

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
           node-version: '20.x'

      - name: Install Dependencies
        run: npm install

      - name: Build Angular
        run: |
          npx ng build --configuration production --base-href /sit/

      - name: Upload Build to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/Nivicapital/*"
          target: "/tmp/angular-build"

      - name: Deploy to SIT Folder
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/angular/sit/*
            sudo cp -r /tmp/angular-build/* /var/www/angular/sit/