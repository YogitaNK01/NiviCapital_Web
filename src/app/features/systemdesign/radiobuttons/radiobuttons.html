

<div class="form-check">

  <input
    class="form-check-input"
    type="radio" [value]="value"
    [name]="name"
    [checked]="selectedValue === value"
    [disabled]="disabled"
    (change)="selectRadio()"
    [id]="label">
  <label class="form-check-label text-body-1" [for]="label">
    {{ label }}
  </label>
</div>
