<div class="datepicker-container">
  <!-- Date Input -->
  <div class="date-input" (click)="openModal()">
    <label>{{ label }}</label>
    <div class="input-wrapper">
      <span>{{ displayDate }}</span>
      <svg class="calendar-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path
          d="M5 1V3M11 1V3M2 5H14M3 3H13C13.5523 3 14 3.44772 14 4V14C14 14.5523 13.5523 15 13 15H3C2.44772 15 2 14.5523 2 14V4C2 3.44772 2.44772 3 3 3Z"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" *ngIf="isModalOpen" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <!-- Modal Header -->
      <div class="modal-header d-flex flex-column align-items-start">

        <div class="text-body-1 selectdate">Select date</div>
        <div class="selected-date-text text-datepicker">{{ displayDate }}</div>
      </div>

      <div class="calendar-header">
        <div class="month-year-button text-body-2" (click)="showMonthSelector()">
          {{ getCurrentMonthYear() }}
        </div>

        <button class="nav-button" (click)="previousMonth()">‹</button>

        <button class="nav-button" (click)="nextMonth()">›</button>
      </div>
      <!-- Calendar Grid Container -->
      <div class="calendars-container">


        <!-- Days View -->
        <div class="calendar-wrapper" *ngIf="currentView === 'days'">


          <div class="weekdays">
            <div class="weekday" *ngFor="let day of weekDays">{{ day }}</div>
          </div>

          <div class="days-grid">
            <button *ngFor="let day of calendarDays" class="day-cell" [class.empty]="day === null"
              [class.selected]="isSelectedDate(day)" [class.today]="isToday(day)" (click)="selectDate(day)"
              [disabled]="day === null">
              {{ day }}
            </button>
          </div>

          <div class="modal-actions">
            <button class="action-button cancel" (click)="cancel()">Cancel</button>
            <button class="action-button ok" (click)="ok()">Ok</button>
          </div>
        </div>

        <!-- Months View -->
        <div class="calendar-wrapper" *ngIf="currentView === 'months'">
          <div class="calendar-header">
            <button class="month-year-button" (click)="showYearSelector()">
              {{ currentMonth.getFullYear() }}
            </button>
          </div>

          <div class="months-grid">
            <button *ngFor="let month of months; let i = index" class="month-cell"
              [class.selected]="i === currentMonth.getMonth()" (click)="selectMonth(i)">
              {{ month }}
            </button>
          </div>

         
        </div>

        <!-- Years View -->
        <div class="calendar-wrapper years-view" *ngIf="currentView === 'years'">
          <div class="calendar-header">
            <span class="year-range-label">Select Year</span>
          </div>

          <div class="years-grid">
            <button *ngFor="let year of years" class="year-cell" [class.selected]="year === currentMonth.getFullYear()"
              [class.current]="year ===  currentYear" (click)="selectYear(year)">
              {{ year }}
            </button>
          </div>

          <div class="modal-actions">
            <button class="action-button cancel" (click)="cancel()">Cancel</button>
            <button class="action-button ok" (click)="ok()">Ok</button>
          </div>
        </div>
      </div>

      
    </div>
  </div>
</div>
