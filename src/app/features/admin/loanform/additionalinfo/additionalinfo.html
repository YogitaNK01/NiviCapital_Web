<div class="base-layout">



    <div class="accordion d-flex flex-column gap-4 mb-4">

        <div class="accordion-item b-0" *ngFor="let acc of accordions; let i = index">

            <h2 class="accordion-header">
                <button class="accordion-button table-head" [class.collapsed]="openIndex !== i" type="button"
                    (click)="toggle(i)">
                    {{ acc.title }}
                </button>
            </h2>

            <div class="accordion-collapse collapse" [class.show]="openIndex === i">

                <div class="accordion-body p-0" *ngIf="openIndex === i">

                    <ng-container *ngIf="i === 0">
                        <ng-container *ngTemplateOutlet="identityTemplate; context:{index:i}">
                        </ng-container>
                    </ng-container>

                </div>
            </div>

        </div>

    </div>

    <ng-template #identityTemplate let-i="index">

        <form [formGroup]="additionalinfoForm" (ngSubmit)="submit()" class="common-details-box d-flex flex-column">

            <div class="row">

                <div class="col-lg-4 col-sm-12 ">
                    <app-uploadbtn [config]="basicConfig" [required]="true" 
                        (fileChange)="onFileChange($event, 'applicantphoto')" label="Upload Applicant Photo">
                    </app-uploadbtn>

                </div>
                <div class="col-lg-4 col-sm-12 ">
                    <app-dropdown [options]="marital_status" [placeholder]="maritalstatus"
                        formControlName="maritalstatus" [required]="true"
                        (selectedValueChange)="additionalinfoForm.get('maritalstatus')?.setValue($event)"
                        [avatarUrl]="avatarUrl" [hasAvatar]="hasAvatar" [label]="maritalstatus">
                    </app-dropdown>



                </div>
                <div class="col-lg-4 col-sm-12 ">
                    <div class="dropdown-label1 all-label ">Gender<span class="text-danger">*</span></div>
                    <div class="d-flex flex-row">
                        <app-radiobuttons name="optionsGroup" 
                            (checkedChange)="gendercheck('Male')" label="Male" value="Male" formControlName="gender">
                        </app-radiobuttons>


                        <app-radiobuttons name="optionsGroup" 
                            (checkedChange)="gendercheck('Female')" label="Female" value="Female"
                            formControlName="gender">
                        </app-radiobuttons>

                        <app-radiobuttons name="optionsGroup" 
                            (checkedChange)="gendercheck('Third')" label="Third Gender" value="Third Gender"
                            formControlName="gender">
                        </app-radiobuttons>
                    </div>

                </div>
                <div class="col-lg-4 col-sm-12 mt-20">


                    <app-inputfield formControlName="dependents" label="Number Of Dependents" [required]="true"
                        placeholder="Number Of Dependents" (input)="main.restrictInput($event, 'number')">
                    </app-inputfield>

                </div>


                <div class="text-label fw-bold mt-20">Spouse Name</div>

                <div class="col-lg-4 col-sm-12 mt-20">
                    <app-inputfield formControlName="s_fname" label="First Name" [required]="true"
                        placeholder="First Name" (input)="main.restrictInput($event, 'text')">
                    </app-inputfield>

                </div>


                <div class="col-lg-4 col-sm-12 mt-20">
                    <app-inputfield formControlName="s_mname" label="Middle Name"
                     placeholder="Middle Name" (input)="main.restrictInput($event, 'text')" [disabled]="isspousemiddlename">
                    </app-inputfield>
                    <app-checkbox [checked]="isspousemiddlename"  [indeterminate]="false"
                        label="I don’t have middle name" (checkedChange)="onmiddlename($event)">
                    </app-checkbox>
                </div>


                <div class="col-lg-4 col-sm-12 mt-20">
                    <app-inputfield formControlName="s_lname" label="Last Name" [required]="true"
                        placeholder="Last Name" (input)="main.restrictInput($event, 'text')" >
                    </app-inputfield>
                </div>

                <!-- Father  Name -->
                <div class="text-label fw-bold mt-20">Father Name</div>

                <div class="col-lg-4 col-sm-12 mt-20">
                    <app-inputfield formControlName="f_fname" label="First Name" [required]="true"
                        placeholder="First Name" (input)="main.restrictInput($event, 'text')">
                    </app-inputfield>

                </div>


                <div class="col-lg-4 col-sm-12 mt-20">
                    <app-inputfield formControlName="f_mname" label="Middle Name" placeholder="Middle Name" 
                    (input)="main.restrictInput($event, 'text')" [disabled]="isfathermiddlename">
                    </app-inputfield >
                    <app-checkbox [checked]="isfathermiddlename"  [indeterminate]="false"
                        label="I don’t have middle name" (checkedChange)="onfathermiddlename($event)">
                    </app-checkbox>
                </div>


                <div class="col-lg-4 col-sm-12 mt-20">
                    <app-inputfield formControlName="f_lname" label="Last Name" [required]="true"
                        placeholder="Last Name" (input)="main.restrictInput($event, 'text')">
                    </app-inputfield>
                </div>

                <!-- Mother Name -->
                <div class="text-label fw-bold mt-20">Mother Name</div>


                <div class="col-lg-4 col-sm-12 mt-20">
                    <app-inputfield formControlName="m_fname" label="First Name" [required]="true"
                        placeholder="First Name" (input)="main.restrictInput($event, 'text')">
                    </app-inputfield>

                </div>


                <div class="col-lg-4 col-sm-12 mt-20">
                    <app-inputfield formControlName="m_mname" label="Middle Name" placeholder="Middle Name" 
                    (input)="main.restrictInput($event, 'text')" [disabled]="ismothermiddlename">
                    </app-inputfield>
                    <app-checkbox [checked]="ismothermiddlename"  [indeterminate]="false"
                        label="I don’t have middle name" (checkedChange)="onmothermiddlename($event)">
                    </app-checkbox>
                </div>


                <div class="col-lg-4 col-sm-12 mt-20">
                    <app-inputfield formControlName="m_lname" label="Last Name" [required]="true"
                        placeholder="Last Name" (input)="main.restrictInput($event, 'text')">
                    </app-inputfield>
                </div>




            </div>




        </form>

    </ng-template>

</div>
<hr class="footer-hr-class">
<div class="loan-footerbtns row w-100  d-flex justify-content-between align-items-center">

    <div class="col-lg-4 ">
        <img src="../assets/images/icons/save.svg">
        <span class="text-dp-3-regular mx-2 blue-text"> Save and Exit</span>
    </div>
    <div class="col-lg-4  d-flex justify-content-end">
        <app-buttons type="button" label="Back" class="btn btncustomClass" [outline]="true" (click)="back()">
        </app-buttons>
        <app-buttons type="button" label="Next" class="btn btncustomClass" color="primary" (click)="next()" [disabled]="!additionalinfoForm.valid">
        </app-buttons>

    </div>
</div>
