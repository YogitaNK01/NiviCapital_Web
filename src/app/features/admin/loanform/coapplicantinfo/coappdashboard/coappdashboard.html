<div class="vh-container">

    <div class="base-layout base-height"  *ngIf="!isChildActive">

        <div class="header ">

            <div class="text-datepicker blue-text d-flex flex-column gap-data ">Co-Applicant
                <div class="text-label-data fw-normal fst-italic">

                    You currently have no co-applicants. Minimum 1 co-applicant is mandatory to complete your
                    application. You can add more as well. Co-applicants ensures your financial capability to repay the
                    loan.
                </div>
                <div>
                    <app-buttons type="button" label="Add " class="btn btncustomClass p-0" [outline]="true"
                        (click)="add()">
                        <img src="/assets/images/icons/addred.svg">
                    </app-buttons>

                </div>
            </div>

        </div>



    </div>
    <router-outlet (activate)="onChildActivate()" (deactivate)="onChildDeactivate()"></router-outlet>
       <div *ngIf="!isChildActive">
        <hr class="footer-hr-class" *ngIf="!isChildActive">
    <div class="loan-footerbtns row w-100  d-flex justify-content-between align-items-center">

        <div class="col-lg-4 ">
            <img src="../assets/images/icons/save.svg">
            <span class="text-dp-3-regular mx-2 blue-text"> Save and Exit</span>
        </div>
        <div class="col-lg-4  d-flex justify-content-end">
            <app-buttons type="button" label="Back" class="btn btncustomClass" [outline]="true" (click)="back()">
            </app-buttons>
            <app-buttons type="button" label="Next" class="btn btncustomClass" color="primary" (click)=" next()">
            </app-buttons>

        </div>
    </div>
    </div>
</div>
