<div class="vh-container">

  <div class="base-layout base-height">

    <div class="header w-100">

      <div class="text-datepicker blue-text d-flex flex-column gap-data ">Co-Applicant
        <div class="text-label-data fw-normal fst-italic">

          You currently have no co-applicants. Minimum 1 co-applicant is mandatory to complete your application. You can
          add more as well.
        </div>
        <!-- STEP 1 Mobile number  -->
        <div *ngIf="mobileSubmitted">
          <form #registerform="ngForm" (ngSubmit)="searchnumber(registerform)" id="registerform"
            class="mobiledetails d-flex w-100 flex-column ">
            <div class="w-100 d-flex align-items-end  gap-3">
              <div class="flex-grow-1">
                <app-inputfield type="tel" name="phone" ngModel [required]="true" pattern="^[6-9][0-9]{9}$"
                  label="Mobile Number" placeholder="Enter Mobile Number" helpText="Help text" class="w-100"
                  minlength="10" [maxlength]="10" #phone="ngModel" (input)="service.restrictInput($event, 'number')"
                  [(ngModel)]="prefillPhone" [showPhonePrefix]="true" [showPhonePrefixnumber]="true"
                  [state]="getPhoneFieldState(phone)"></app-inputfield>


              </div>

            </div>

            <!-- <div class="text-danger mt-1" *ngIf="phone.invalid && phone.touched">
                <small *ngIf="phone.errors?.['required']">Phone number is required</small>
                <small *ngIf="phone.errors?.['pattern']">Please enter a valid 10-digit phone number</small>
            </div>
            <div class="text-danger mt-1" *ngIf="norecordfound && phone.valid">
                <small>No Record Found</small>
            </div> -->

          </form>

        </div>

        <!-- STEP 2  co-applicant steppers-->
        <div *ngIf="!mobileSubmitted">
          <app-coappstepper></app-coappstepper>
          <!-- <router-outlet></router-outlet> -->
        </div>

      </div>

    </div>
  </div>

  <hr class="footer-hr-class">
  <div class="loan-footerbtns row w-100  d-flex justify-content-between align-items-center">

    <div class="col-lg-4 ">
      <img src="../assets/images/icons/save.svg">
      <span class="text-dp-3-regular mx-2 blue-text"> Save and Exit</span>
    </div>
    <div class="col-lg-4  d-flex justify-content-end">
      <app-buttons type="button" label="Back" class="btn btncustomClass" [outline]="true" (click)="back()">
      </app-buttons>
      <app-buttons type="button" label="Next" class="btn btncustomClass" color="primary" (click)=" next()">
      </app-buttons>

    </div>
  </div>
</div>
