<div class="d-flex flex-column container-fluid">
<div class="horizontal-stepper w-100">
  <div class="step"
       *ngFor="let step of steps ; let i = index"
       [ngClass]="{
         active: isActive(i),
         completed: isCompleted(i),
         upcoming: isUpcoming(i),
        disabled: !canNavigate(i)

       }"
       (click)="canNavigate(i) && goToStep(step, i)">

<!-- (click)="canNavigate(i) && goToStep(step, i)" -->

    <div class="text-dp-3-regular step-content">{{ step.label }}</div>
  </div>
</div>
 <div class="step-body">
  <div class="container-fluid p-0">
    <router-outlet ></router-outlet>
 </div></div>
</div>
