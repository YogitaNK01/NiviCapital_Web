<div class="page-card">
  
  <div class=" form-area row g-4">
    <!-- Left Form -->
    <div class="col-lg-5">
      <form class="form-section" #basicincomeform="ngForm" (ngSubmit)="submitForm(basicincomeform)" id="basicincomeform" >

        <div class="">
          <app-dropdown [options]="selectIncome" [placeholder]="'Enter annual income'" [required]="true"  [(ngModel)]="annual_Income"
            [avatarUrl]="avatarUrl" [hasAvatar]="hasAvatar" [label]="'What’s your Annual Income?'" name="annual_Income">
          </app-dropdown>
        </div>

        <div class="">
          <div class="d-flex justify-content-between align-items-center">
            <label class="text-dp-3-regular fw-bold">Rate Of Interest (p.a)</label>
            <span class="value-box text-dp-1-medium ">{{ rateOfInterest }}%</span>
          </div>
          <input type="range" class="form-range" min="9.5" max="15" step="0.1" [(ngModel)]="rateOfInterest" name="rate">
        </div>

        <div class="">
          <div class="d-flex justify-content-between align-items-center">
            <div class=""><label class="text-dp-3-regular fw-bold">How much money do you need?</label>
            <div class="text-body-1">Choose the loan amount that fits your needs <br>and financial goals.</div></div>
            
            <!-- <span class="value-box text-dp-1-medium ">₹{{ loanAmount }}</span> -->
             <input type="number"class="value-box text-dp-1-medium" [(ngModel)]="loanAmount" min="100000"  max="4500000" step="10000" name="loanamt">
          </div>

          <input type="range" class="form-range mt-2" min="100000" max="4500000" step="10000" [(ngModel)]="loanAmount"
           name="loanamt">
        </div>

          <div class="">
          <div class="d-flex justify-content-between align-items-center">
            <label class="text-dp-3-regular fw-bold">Loan Tenure</label>
            <!-- <span class="value-box text-dp-1-medium ">{{ tenure }}yr</span> -->
             <input type="number" class="value-box text-dp-1-medium" [(ngModel)]="tenure" min="1" max="7" name="tenureInput">
          </div>
         <input type="range" class="form-range" min="1" max="7" step="1" [(ngModel)]="tenure" name="tenureInput">
        </div>


        <div class="">
          <app-dropdown [options]="selectpaymentmode"  [required]="true" [(ngModel)]="paymentmode" name="paymentmode"
            [avatarUrl]="avatarUrl" [hasAvatar]="hasAvatar" [label]="'Mode Of Payment'" >
          </app-dropdown>
        </div>

        <app-buttons label="Apply loan" class="btn btncustomClass w-100" type="submit" [disabled]="!basicincomeform.valid"
         color="primary" (click)="next()" ></app-buttons>
      </form>
    </div>

    <!-- Right Side - Chart + Summary -->
    <div class="col-lg-5">
      <div class="chart-container">
        <!-- Donut Chart using Bootstrap + CSS -->
        <div class="donut-chart mx-auto">
          <!-- <app-charts [title]="'Donut Chart'" [data]="chartData1"></app-charts> -->
          <app-charts [title]="''" [data]="chartData1" [width]="450" [height]="450"
                                    [radius]="80" [innerRadius]="50" [centerX]="100" [centerY]="100"></app-charts>
        </div>
      </div>
    </div>
    <div class="col-lg-2 d-flex flex-column align-items-center justify-content-center">
      <div class="summary-grid">
        <div class="summary-card text-center">
          <div class="text-label-data fw-normal">TOTAL INTEREST PAYABLE</div>
          <div class="text-dp-3-bold text-nowrap">₹ {{ totalInterestPayable | number }}</div>
        </div>
        <div class="summary-card text-center">
          <div class="text-label-data fw-normal">TOTAL PRINCIPLE AMOUNT</div>
          <div class="text-dp-3-bold text-nowrap">₹ {{ totalPrincipalAmount | number }}</div>
        </div>
        <div class="summary-card text-center">
          <div class="text-label-data fw-normal">TOTAL EMI AMOUNT</div>
          <div class="text-dp-3-bold text-nowrap">₹ {{ totalEmiAmount | number }}</div>
        </div>
         <div class="text-center mt-3">
      <a href="#" class="see-amortization text-dp-3-regular d-flex gap-2"><span><img src="../assets/images/icons/arrow-square-down.svg"></span>See Amortization</a>
    </div>
    
      </div>

      
    </div>
   

  </div>


  <!-- <div class="col-lg-12 mt-4 d-flex justify-content-between">

    <div class="col-lg-4 mt-4">
      <img src="../assets/images/icons/save.svg">
      <span class="text-dp-3-regular mx-2 blue-text"> Save and Exit</span>
    </div>
    <div class="col-lg-4 mt-4 d-flex justify-content-end">
      <app-buttons type="button" label="Back" class="btn btncustomClass" [outline]="true" (click)="back()">
      </app-buttons>
      <app-buttons type="button" label="Next" class="btn btncustomClass" color="primary" (click)="next()">
      </app-buttons>

    </div>
  </div> -->
</div>
