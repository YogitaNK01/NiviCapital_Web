<div class="base-layout">

    <div class="row w-100 d-flex blue-head-box text-center">
        <p class="text-dp-3-bold">Total Expense : ₹10,00,00 </p>
    </div>
    <div class="row w-100 ">
        <div class=" d-flex  ">
            <div class="w-100 gap-3">
                <!-- all categories -->
                <app-dropdown [options]="monthlyExpenditure" [multiSelect]="true"
                    [(selectedValue)]="selectedexpenditure" [placeholder]="'Select Monthly Expenditure'"
                    (selectedValueChange)="onChange($event)" [avatarUrl]="avatarUrl" [hasAvatar]="hasAvatar"
                    [label]="'Monthly Expenditure'">
                </app-dropdown>
            </div>
        </div>

    </div>

    <form [formGroup]="monthlyExpenditureForm" (ngSubmit)="submit()" id="expenseForm" class="w-100 ">

        <div class=" accordion d-flex flex-column gap-4 mb-4">

            <div class="accordion-item b-0" *ngFor="let acc of accordions; let i = index"
                [hidden]="!selectedexpenditure.includes(acc.key)">

                <h2 class="accordion-header">
                    <button class="accordion-button table-head" [class.collapsed]="!openIndex.includes(i)" type="button"
                        (click)="toggle(i)">

                        <span class="flex-grow-1">{{ acc.title }}</span>
                        <span class="delete-icon" (click)="removeAccordion(acc.key, i, $event)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none">
                                <path d="M3 6H21" stroke="#25262F" stroke-width="1.5" />
                                <path d="M8 6V4C8 3 9 2 10 2H14C15 2 16 3 16 4V6" stroke="#25262F" stroke-width="1.5" />
                                <path d="M19 6L18 20C18 21 17 22 15 22H9C7 22 6 21 6 20L5 6" stroke="#25262F"
                                    stroke-width="1.5" />
                            </svg>
                        </span>
                    </button>
                </h2>


                <div class="accordion-collapse collapse" [class.show]="openIndex.includes(i)">

                    <div class="accordion-body p-0 ">


                        <ng-container *ngIf="i === 0">
                            <ng-container *ngTemplateOutlet="rentmaintenanceTemplate; context:{index:i}">
                            </ng-container>
                        </ng-container>

                        <ng-container *ngIf="i === 1">
                            <ng-container *ngTemplateOutlet="GroceriesandHouseholdTemplate; context:{index:i}">

                            </ng-container>
                        </ng-container>

                        <ng-container *ngIf="i === 2">
                            <ng-container *ngTemplateOutlet="UtilitiesTemplate; context:{index:i}">

                            </ng-container>
                        </ng-container>

                        <ng-container *ngIf="i === 3">
                            <ng-container *ngTemplateOutlet="TransportationTemplate; context:{index:i}">

                            </ng-container>
                        </ng-container>
                        <ng-container *ngIf="i === 4">
                            <ng-container *ngTemplateOutlet="SchoolTemplate; context:{index:i}">

                            </ng-container>
                        </ng-container>
                        <ng-container *ngIf="i === 5">
                            <ng-container *ngTemplateOutlet="MedicalTemplate; context:{index:i}">

                            </ng-container>
                        </ng-container>

                        <ng-container *ngIf="i === 6">
                            <ng-container *ngTemplateOutlet="OtherTemplate; context:{index:i}">

                            </ng-container>
                        </ng-container>




                    </div>
                </div>

            </div>

        </div>

        <ng-template #rentmaintenanceTemplate let-i="index">
            <div class="row common-details-box d-flex flex-row gap-0 " formGroupName="rent">

                <div class="form-group mb-3">
                    <app-inputfield type="text" label="Rent/ Home Maintenance" formControlName="rentvalue"
                        placeholder="Enter Rent/ Home Maintenance" helpText="Help text" name="rentvalue">
                    </app-inputfield>


                </div>
            </div>
        </ng-template>

        <ng-template #GroceriesandHouseholdTemplate let-i="index">
            <div class="row common-details-box d-flex flex-row gap-0 " formGroupName="grocery">

                <div class="form-group mb-3">
                    <app-inputfield type="text" label="Groceries and Household" formControlName="groceryvalue"
                        placeholder="Enter Groceries and Household" helpText="Help text" name="groceryvalue">
                    </app-inputfield>


                </div>
            </div>
        </ng-template>

        <ng-template #UtilitiesTemplate let-i="index">
            <div class="row common-details-box d-flex flex-row gap-0 " formGroupName="utilities">
                <div class="col">
                    <div class="form-group mb-3">
                        <app-inputfield type="text" label="Telephone and Internet bills" formControlName="utilityvalue1"
                            placeholder="Enter Telephone and Internet bills" helpText="Help text" name="utilityvalue1">
                        </app-inputfield>


                    </div>
                </div>
                <div class="col">
                    <div class="form-group mb-3">
                        <app-inputfield type="text" label="Utilities (Electricity, Water, Gas)"
                            formControlName="utilityvalue2" placeholder="Enter Utility bills" helpText="Help text"
                            name="utilityvalue2">
                        </app-inputfield>


                    </div>
                </div>

            </div>
        </ng-template>

        <ng-template #TransportationTemplate let-i="index">
            <div class="row common-details-box d-flex flex-row gap-0 " formGroupName="transportation">

                <div class="form-group mb-3">
                    <app-inputfield type="text" label="Transportation" formControlName="transportationvalue"
                        placeholder="Enter Transportation" helpText="Help text" name="transportationvalue">
                    </app-inputfield>


                </div>
            </div>
        </ng-template>

        <ng-template #SchoolTemplate let-i="index">
            <div class="row common-details-box d-flex flex-row gap-0 " formGroupName="SchoolFees">

                <div class="form-group mb-3">
                    <app-inputfield type="text" label="School Education Fees" formControlName="SchoolFeesvalue"
                        placeholder="Enter School Education Fees" helpText="Help text" name="SchoolFeesvalue">
                    </app-inputfield>


                </div>
            </div>
        </ng-template>

        <ng-template #MedicalTemplate let-i="index">
            <div class="row common-details-box d-flex flex-row gap-0 " formGroupName="MedicalMedicines">

                <div class="form-group mb-3">
                    <app-inputfield type="text" label="Medical/ Medicines" formControlName="MedicalMedicinesvalue"
                        placeholder="Enter Medical/ Medicines" helpText="Help text" name="MedicalMedicinesvalue">
                    </app-inputfield>


                </div>
            </div>
        </ng-template>

        <ng-template #OtherTemplate let-i="index">
            <div formArrayName="other">
                @for(item of other.controls; track $index; let i = $index){
                <div class="row common-details-box d-flex flex-row gap-0 " [formGroupName]="i">

                    <div class="col">
                        <div class="form-group mb-3">


                            <app-dropdown [options]="otherExpenses" formControlName="type" name="type"
                                [placeholder]="'Select type'" [avatarUrl]="avatarUrl" [hasAvatar]="hasAvatar"
                                [label]="'Expense '+(i+1)">
                            </app-dropdown>

                        </div>
                    </div>
                    <div class="col" *ngIf="other.at(i).get('type')?.value === 'Other'">
                        <div class="form-group mb-3">
                            <app-inputfield  type="text"
                                label="Enter Other Expense" formControlName="customType"
                                placeholder="Enter custom expense">
                            </app-inputfield>
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group mb-3">
                            <app-inputfield type="text" label="Amount (INR)" formControlName="amount"
                                placeholder="Enter Amount" helpText="Help text" name="amount">
                            </app-inputfield>


                        </div>
                    </div>
                </div>
                @if(i == other.length - 1){
                <div class="form-group common-details-box pt-0">
                    <app-buttons label="Add Other Recurring Expense" class="btn btn-icon Add btncustomClass"
                        [outline]="true" (click)="addmore()">
                        <img src="/assets/images/icons/addred.svg">
                    </app-buttons>


                </div>
                }

                }
            </div>
        </ng-template>
    </form>
</div>
<hr class="footer-hr-class">
<div class="loan-footerbtns row w-100  d-flex justify-content-between align-items-center">

    <div class="col-lg-4 ">
        <img src="../assets/images/icons/save.svg">
        <span class="text-dp-3-regular mx-2 blue-text"> Save and Exit</span>
    </div>
    <div class="col-lg-4  d-flex justify-content-end">
        <app-buttons type="button" label="Back" class="btn btncustomClass" [outline]="true" (click)="back()">
        </app-buttons>
        <!-- <app-buttons type="button" label="Next" class="btn btncustomClass" color="primary" (click)="next1()" ></app-buttons> -->
        <app-buttons type="button" label="Next" class="btn btncustomClass" color="primary" (click)="next()">
        </app-buttons>

    </div>
</div>
<!-- [disabled]="!monthlyExpenditureForm.valid" -->
