<div class="dashboard main-content-feature">
  <!-- Header -->
  <div class="content-header">
    <div class="content-title text-dp-3-bold">
      Dashboard-Customer
    </div>
    <div class="user-info-breadcrumb">

      <div>
        <nav aria-label="breadcrumb" class="breadcrumb">
          <ol class="breadcrumb-list">
            <li class="breadcrumb-item text-common "><a routerLink="/home">Home</a></li>
            <li class="breadcrumb-item active text-common " aria-current="page">Customer</li>
          </ol>
        </nav>

      </div>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="stats-container">
    <div class="stat-card commonbox">
      <div class="metrics ">
        <div class="key-data">
          <div class="key-data1">
            <p class=" text-common">Total Customers</p>
            <h2 class=" text-dp-3-bold stat-label">{{ totalItems | number }}</h2>
            <p class=" text-body-2 greentext">{{ customerGrowth }}</p>
          </div>
          <img src="/assets/images/sidemenu/note.svg" alt="Message" class="key-card-image" />

        </div>

      </div>
    </div>

    <div class="stat-card commonbox">
      <div class="metrics ">
        <div class="key-data">
          <div class="key-data1">
            <p class=" text-common">KYC Completed</p>
            <h2 class=" text-dp-3-bold">{{ kycCompleted }}%</h2>
            <p class=" text-body-2 greentext">{{ kycGrowth }}</p>
          </div>
          <img src="/assets/images/sidemenu/note.svg" alt="Message" class="key-card-image" />

        </div>

      </div>
    </div>
  </div>

  <!-- Customer Database Section -->
  <div class="database-section">
    <!-- header  -->
    <div class="section-header">
      <div class="db-title text-dp-2-bold">Customer Database</div>
      <div class="section-controls">
        <div class="search-box">
          <app-inputfield label="Input Label" type="text" placeholder="Search for result" helpText="Help text" [showSearch]="true"
            [showLabel]="false" [showHelpText]="false" (valueChange)="onSearchChange($event)"> >
          </app-inputfield>
        </div>




        <div class="search-dropdown search-dropdown-status">
          <app-dropdown class="menu-dropdown" [options]="Kycstatus" [(selectedValue)]="selectedstatus" [customStyle]="true"
            placeholder="All KYC Status" (selectedValueChange)="getkycstatus($event)">
          </app-dropdown>
        </div>

        <div class="search-dropdown search-dropdown-type">
          <app-dropdown class="menu-dropdown" [options]="kyctype" [(selectedValue)]="selectedOptiontype" placeholder="All Types"
            [customStyle]="true" (selectedValueChange)="getkyc_type($event)">
          </app-dropdown>
        </div>


        <div class="add-button">
          <app-buttons label="Add Customer" class="btn btn-icon Add btncustomClass" [outline]="true">
            <img src="/assets/images/icons/addred.svg" alt="Add" [routerLink]="['/customer/details']"
              [queryParams]="{ mode: 'add' }">

          </app-buttons>
        </div>
      </div>
    </div>

    <!-- Table -->
   
    <app-tables
  [columns]="columns"
  [data]="filteredData"
  [pageSize]="6">
</app-tables>
  </div>

  
    
</div>
