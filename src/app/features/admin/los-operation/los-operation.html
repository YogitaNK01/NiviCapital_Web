  <!-- Customer Database Section -->
  <div class="database-section">
    <!-- header  -->
    <div class="section-header">
      <div class="db-title text-dp-2-bold">Customer Database</div>
      <div class="section-controls">
        <div class="search-box">
          <app-inputfield label="Input Label" type="text" placeholder="Search for result" helpText="Help text"
            [showSearch]="true" [showLabel]="false" [showHelpText]="false" (valueChange)="onSearchChange($event)"> >
          </app-inputfield>
        </div>


        <div class="search-dropdown search-dropdown-type">
          <app-dropdown class="menu-dropdown" [options]="Kycstatus" [(selectedValue)]="selectedOption1"
            [placeholder]="AllTypes" [customStyle]="true" (selectedValueChange)="getkyc_type($event)" >
          </app-dropdown>
        </div>


        <div class="add-button">
          <app-buttons label="Apply Loan" class="btn btn-icon Add btncustomClass" [outline]="true"
            (click)="applyLoan()">
            <img src="/assets/images/icons/addred.svg" alt="Add">

          </app-buttons>
        </div>
      </div>
    </div>

    <!-- Table -->
     
    @if (!nodata) {
    <app-tables [columns]="columns" 
    [data]="filteredData" 
    [pageSize]="6" 
    [totalPages]="totalPages"
  (pageChange)="onPageChange($event)"
  [disableEditFn]="disableEditCondition"
  [hidepagination]="this.searchText.length > 0">
    </app-tables>
    } @else {
  <div class="text-label text-center mt-4">
    No Active Customer...
  </div>
}
