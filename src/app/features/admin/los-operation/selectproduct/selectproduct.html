<div class="check-customer  d-flex flex-column">
    <div class="header ">

        <div class="text-header1-login d-flex flex-column gap-3">Apply New Loan
            <div class="text-label-data fw-normal">One step closer to your study abroad dream</div>
        </div>

    </div>
    <div class="mobiledetails d-flex w-100 flex-column ">
        <div class="w-100 gap-3">
            <app-dropdown [options]="selectProduct" [(selectedValue)]="selectedproduct" [placeholder]="product" [required]="true"
                (selectedValueChange)="onSelectionChange('product',$event)" [avatarUrl]="avatarUrl" [hasAvatar]="hasAvatar" [label]="product" [(ngModel)]="searchedvalue">
            </app-dropdown>
        </div>

        <div class="w-100 gap-3">
            <app-dropdown [options]="seleactloantype" [(selectedValue)]="selectedloantype" [placeholder]="loantype" [required]="true"
                (selectedValueChange)="onSelectionChange('loantype',$event)" [avatarUrl]="avatarUrl" [hasAvatar]="hasAvatar" [label]="loantype" [(ngModel)]="searchedvalue">
            </app-dropdown>
        </div>

           <div class="w-100 gap-3">
            <app-dropdown [options]="selectSegment" [(selectedValue)]="selectedsegment" [placeholder]="segment" [required]="true"
                (selectedValueChange)="onSelectionChange('segment',$event)" [avatarUrl]="avatarUrl" [hasAvatar]="hasAvatar" [label]="segment" [(ngModel)]="searchedvalue">
            </app-dropdown>
        </div>


           <div class="w-100 gap-3">
            <app-dropdown [options]="seleactCategory" [(selectedValue)]="seleactedcategory" [placeholder]="catagory" [required]="true"
                (selectedValueChange)="onSelectionChange('catagory',$event)" [avatarUrl]="avatarUrl" [hasAvatar]="hasAvatar" [label]="catagory" [(ngModel)]="searchedvalue">
            </app-dropdown>
        </div>

    </div>
    </div>
